<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. Evidence-to-action chain and five process-red-team steps</title>
  <desc id="desc">A six-stage evidence-to-action chain runs from evidence through representation, routing and permission, review, action, and correction or restoration, with reassessment feeding back to evidence and representation. A comparison rail keeps formal authority, independent support, automatic permission, and execution distinct. Five diagnostic steps below map transformations, test permission, test review and service, stress operational conditions, and test contestability and restoration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="1120" fill="#FFFFFF"/>

  <text x="45" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17212B">Figure 1. Evidence-to-action chain and five process-red-team steps</text>
  <text x="45" y="79" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52606D">The evaluation unit is one path through the workflow—not model accuracy or a nominal reviewer in isolation</text>

  <rect x="45" y="105" width="1110" height="340" rx="12" fill="#F8FAFC" stroke="#D8DEE6"/>
  <text x="70" y="143" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17212B">A  Trace the operating chain</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="70" y="175" width="150" height="125" rx="9" fill="#EAF5F0" stroke="#2E7D5B" stroke-width="2"/>
      <rect x="70" y="175" width="150" height="10" rx="5" fill="#2E7D5B"/>
      <text x="145" y="215" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">Evidence</text>
      <text x="145" y="244" font-size="15" text-anchor="middle" fill="#52606D">observed, derived,</text>
      <text x="145" y="266" font-size="15" text-anchor="middle" fill="#52606D">imputed, disputed,</text>
      <text x="145" y="288" font-size="15" text-anchor="middle" fill="#52606D">or missing</text>
    </g>
    <line x1="220" y1="237" x2="245" y2="237" stroke="#52606D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="250" y="175" width="150" height="125" rx="9" fill="#EAF1F8" stroke="#2563A6" stroke-width="2"/>
      <rect x="250" y="175" width="150" height="10" rx="5" fill="#2563A6"/>
      <text x="325" y="215" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">Representation</text>
      <text x="325" y="244" font-size="13" text-anchor="middle" fill="#52606D">typing &amp; provenance</text>
      <text x="325" y="266" font-size="13" text-anchor="middle" fill="#52606D">aggregation &amp; surfacing</text>
      <text x="325" y="288" font-size="13" text-anchor="middle" fill="#52606D">assumptions</text>
    </g>
    <line x1="400" y1="237" x2="425" y2="237" stroke="#52606D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="430" y="175" width="150" height="125" rx="9" fill="#F1EDF7" stroke="#7252A3" stroke-width="2"/>
      <rect x="430" y="175" width="150" height="10" rx="5" fill="#7252A3"/>
      <text x="505" y="211" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">Routing &amp;</text>
      <text x="505" y="233" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">permission</text>
      <text x="505" y="262" font-size="13" text-anchor="middle" fill="#52606D">what becomes available</text>
      <text x="505" y="284" font-size="13" text-anchor="middle" fill="#52606D">automatically?</text>
    </g>
    <line x1="580" y1="237" x2="605" y2="237" stroke="#52606D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="610" y="175" width="150" height="125" rx="9" fill="#FFF3E8" stroke="#C56A11" stroke-width="2"/>
      <rect x="610" y="175" width="150" height="10" rx="5" fill="#C56A11"/>
      <text x="685" y="215" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">Review</text>
      <text x="685" y="244" font-size="13" text-anchor="middle" fill="#52606D">visibility &amp; authority</text>
      <text x="685" y="266" font-size="13" text-anchor="middle" fill="#52606D">dependency &amp; timing</text>
      <text x="685" y="288" font-size="13" text-anchor="middle" fill="#52606D">exact authorization</text>
    </g>
    <line x1="760" y1="237" x2="785" y2="237" stroke="#52606D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="790" y="175" width="150" height="125" rx="9" fill="#FCEDEA" stroke="#B3382C" stroke-width="2"/>
      <rect x="790" y="175" width="150" height="10" rx="5" fill="#B3382C"/>
      <text x="865" y="215" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">Action</text>
      <text x="865" y="244" font-size="13" text-anchor="middle" fill="#52606D">progression, constraint,</text>
      <text x="865" y="266" font-size="13" text-anchor="middle" fill="#52606D">information, or</text>
      <text x="865" y="288" font-size="13" text-anchor="middle" fill="#52606D">restoration</text>
    </g>
    <line x1="940" y1="237" x2="965" y2="237" stroke="#52606D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="970" y="175" width="150" height="125" rx="9" fill="#EAF5F0" stroke="#2E7D5B" stroke-width="2"/>
      <rect x="970" y="175" width="150" height="10" rx="5" fill="#2E7D5B"/>
      <text x="1045" y="207" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">Correction &amp;</text>
      <text x="1045" y="229" font-size="18" font-weight="700" text-anchor="middle" fill="#17212B">restoration</text>
      <text x="1045" y="258" font-size="13" text-anchor="middle" fill="#52606D">opportunity &amp; uptake</text>
      <text x="1045" y="280" font-size="13" text-anchor="middle" fill="#52606D">repair &amp; residuals</text>
    </g>
    <path d="M 1045 175 C 1045 154, 325 154, 325 171" fill="none" stroke="#2E7D5B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="685" y="169" font-size="13" text-anchor="middle" fill="#2E7D5B">reassessment may update evidence/representation</text>
  </g>

  <rect x="70" y="314" width="1050" height="42" rx="8" fill="#FFFFFF" stroke="#7252A3" stroke-width="1.5"/>
  <text x="595" y="340" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#17212B">Keep distinct: formal authority L(q) • independent support Jσ • automatic permission P_auto • executed action X</text>

  <rect x="70" y="368" width="1050" height="58" rx="8" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text x="595" y="393" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#17212B">Follow one exact action identity across the chain</text>
  <text x="595" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#52606D">Reevaluate support after material changes in evidence, representation, time, process state, policy, or rule version</text>

  <g transform="translate(0 20)">
  <rect x="45" y="445" width="1110" height="565" rx="12" fill="#F8FAFC" stroke="#D8DEE6"/>
  <text x="70" y="483" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17212B">B  Apply the five diagnostic steps</text>
  <text x="145" y="516" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#52606D">STEP</text>
  <text x="420" y="516" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#52606D">CORE QUESTION</text>
  <text x="880" y="516" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#52606D">REQUIRED RECEIPT</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="70" y="530" width="1060" height="82" rx="8" fill="#FFFFFF" stroke="#D8DEE6"/>
      <rect x="70" y="530" width="8" height="82" rx="4" fill="#2563A6"/>
      <circle cx="108" cy="571" r="22" fill="#2563A6"/>
      <text x="108" y="578" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
      <text x="145" y="562" font-size="17" font-weight="700" fill="#17212B">Map transformations</text>
      <text x="145" y="587" font-size="15" fill="#52606D">and ownership</text>
      <text x="420" y="558" font-size="15" fill="#17212B">Where does a policy-relevant distinction</text>
      <text x="420" y="582" font-size="15" fill="#17212B">first disappear?</text>
      <text x="880" y="558" font-size="14" fill="#17212B">typed claim + provenance</text>
      <text x="880" y="582" font-size="14" fill="#52606D">transition + diagnostic owner</text>
    </g>
    <g>
      <rect x="70" y="624" width="1060" height="82" rx="8" fill="#FFFFFF" stroke="#D8DEE6"/>
      <rect x="70" y="624" width="8" height="82" rx="4" fill="#7252A3"/>
      <circle cx="108" cy="665" r="22" fill="#7252A3"/>
      <text x="108" y="672" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
      <text x="145" y="656" font-size="17" font-weight="700" fill="#17212B">Test what weaker</text>
      <text x="145" y="681" font-size="17" font-weight="700" fill="#17212B">evidence permits</text>
      <text x="420" y="652" font-size="15" fill="#17212B">Does information loss add unsupported</text>
      <text x="420" y="676" font-size="15" fill="#17212B">automatic progression?</text>
      <text x="880" y="652" font-size="14" fill="#17212B">action inventory + support rule</text>
      <text x="880" y="676" font-size="14" fill="#52606D">F1: refinement certificate; F2: intervention pair</text>
    </g>
    <g>
      <rect x="70" y="718" width="1060" height="82" rx="8" fill="#FFFFFF" stroke="#D8DEE6"/>
      <rect x="70" y="718" width="8" height="82" rx="4" fill="#C56A11"/>
      <circle cx="108" cy="759" r="22" fill="#C56A11"/>
      <text x="108" y="766" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
      <text x="145" y="750" font-size="17" font-weight="700" fill="#17212B">Test operational</text>
      <text x="145" y="775" font-size="17" font-weight="700" fill="#17212B">review</text>
      <text x="420" y="746" font-size="15" fill="#17212B">Does review block unsupported action and reach</text>
      <text x="420" y="770" font-size="15" fill="#17212B">a supported disposition before the deadline?</text>
      <text x="880" y="746" font-size="14" fill="#17212B">gate safety + review effectiveness</text>
      <text x="880" y="770" font-size="14" fill="#52606D">action-bound authorization + service clock</text>
    </g>
    <g>
      <rect x="70" y="812" width="1060" height="82" rx="8" fill="#FFFFFF" stroke="#D8DEE6"/>
      <rect x="70" y="812" width="8" height="82" rx="4" fill="#B3382C"/>
      <circle cx="108" cy="853" r="22" fill="#B3382C"/>
      <text x="108" y="860" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
      <text x="145" y="844" font-size="17" font-weight="700" fill="#17212B">Stress operations</text>
      <text x="145" y="869" font-size="15" fill="#52606D">access, load, deadlines</text>
      <text x="420" y="840" font-size="15" fill="#17212B">What happens when access fails or service</text>
      <text x="420" y="864" font-size="15" fill="#17212B">capacity is insufficient before timeout?</text>
      <text x="880" y="840" font-size="14" fill="#17212B">document, trace, or simulation</text>
      <text x="880" y="864" font-size="14" fill="#52606D">level + claim-limit receipt</text>
    </g>
    <g>
      <rect x="70" y="906" width="1060" height="82" rx="8" fill="#FFFFFF" stroke="#D8DEE6"/>
      <rect x="70" y="906" width="8" height="82" rx="4" fill="#2E7D5B"/>
      <circle cx="108" cy="947" r="22" fill="#2E7D5B"/>
      <text x="108" y="954" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
      <text x="145" y="938" font-size="17" font-weight="700" fill="#17212B">Test contestability</text>
      <text x="145" y="963" font-size="15" fill="#52606D">and restoration</text>
      <text x="420" y="934" font-size="15" fill="#17212B">Was correction reachable, usable, completed,</text>
      <text x="420" y="958" font-size="15" fill="#17212B">and restorative?</text>
      <text x="880" y="934" font-size="14" fill="#17212B">path + horizon + consequence vector</text>
      <text x="880" y="958" font-size="14" fill="#52606D">opportunity, uptake, repair, residuals</text>
    </g>
  </g>

  <text x="45" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17212B">Output:</text>
  <text x="110" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52606D">separate findings, missing information, owners, interventions, tradeoffs, and claim limits—never one aggregate compliance score.</text>
  <text x="45" y="1077" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52606D">Source: formal model and Process-Red-Team Protocol 1.0. Usability is a design objective, not an evaluated result.</text>
  </g>
</svg>
