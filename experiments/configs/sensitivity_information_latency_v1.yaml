config_id: SENSITIVITY-INFORMATION-LATENCY-V1
mode: sensitivity
design_role: prespecified_sensitivity
parent_config_id: CONFIRMATORY-V1
sensitivity_id: information_retrieval_latency_doubled
purpose: prespecified non-core sensitivity for slower agency evidence acquisition
policy_ids: [U0, U1, U2C, U2O, U3]
cohort_size: 80
replications: 30
seed_prefix: SENSITIVITY-INFORMATION-LATENCY-SEED-V1
scenario_selection_rule: complete 108-family constrained Cartesian grid in canonical scenario-ID order
base_overlay:
  overlay_id: SENSITIVITY-INFORMATION-LATENCY-OVERLAY@1
  provenance: sensitivity
  initiation_window: "100"
  notice_delay: "1"
  response_deadline: "21"
  review_capacity: "2"
  review_service_time: "10"
  review_service_window: "14"
  extension_duration: "7"
  notice_delivery_probability: "0.95"
  administrative_access_probability: "0.8"
  comprehension_probability: "0.85"
  record_availability_probability: "0.7"
  response_effort_limit: "0.55"
  assistance_effort_bonus: "0.3"
  assistance_capacity: "2"
  assistance_service_time: "5"
  assistance_service_window: "21"
  extension_effort_bonus: "0.15"
  extension_need_probability: "0.25"
  evidence_retrieval_success_probability: "0.7"
  evidence_retrieval_latency_scale: "20"
  external_consequence_delay: "1"
  recovery_start_delay: "2"
  recovery_capacity: "2"
  recovery_service_time: "8"
  recovery_window: "20"
  correction_request_delay: "7"
  correction_uptake_probability: "0.5"
  reassessment_capacity: "2"
  reassessment_service_time: "10"
  correction_window: "14"
  restoration_delay: "5"
  restoration_window: "50"
  administrative_cutoff: "650"
precision:
  minimum_replications: 30
  maximum_replications: 30
  target_rate_mcse: 0.05
  target_paired_mcse: 0.06
  extension_rule: no extension; report sensitivity MCSE transparently
runtime:
  run_ceiling_seconds: 86400
analysis:
  primary_metrics:
    - unsupported_progression_rate
    - gate_safe_rate
    - review_effective_rate
    - decision_service_effective_rate
    - unresolved_hold_rate
    - recovery_exposure_rate
    - recipient_burden_rate
    - agency_workload_rate
    - right_censored_rate
  primary_contrasts: [U3-minus-U0]
  confidence_interval: normal_95_from_replication_mcse
  scenario_generalization_unit: family
  pooling_rule: sensitivity remains separate from the core
  censoring_rule: use the core stage-aware censoring rule
negative_controls:
  - P0-SAME-RULE-SEMANTIC-NULL
  - P0-ROUTING-INVARIANCE
outputs:
  attempts_directory: outputs/sensitivity_information_latency_v1/attempts
  run_index_path: outputs/sensitivity_information_latency_v1/run_index.json
  reconciliation_path: outputs/sensitivity_information_latency_v1/reconciliation.json
  analysis_directory: outputs/sensitivity_information_latency_v1/analysis
  negative_control_receipt_path: data/golden_traces/slice4_negative_control_receipt_v1.json
freeze_readiness:
  status: blocked
  unresolved_items:
    - FREEZE_MANIFEST_IMPLEMENTATION
