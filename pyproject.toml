[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-permission-simulation"
version = "0.1.0"
description = "Invariant-based process red teaming and dynamic simulation grounded in the Robodebt process"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "orjson>=3.10",
  "pydantic>=2.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
