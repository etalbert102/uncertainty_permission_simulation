manifest_gates:
  - id: SCHEMA_MANIFEST_DRIFT
    owner: schemas
    checks:
      - every_manifest_payload_has_one_model
      - every_persisted_model_has_one_manifest_payload
      - every_fixture_schema_pair_is_declared
      - every_closed_implementation_signature_is_declared
      - every_implementation_signature_declares_code_hash_input_roles_cardinalities_and_outputs
      - every_input_field_parameter_names_a_declared_input_role
  - id: SCHEMA_REFERENCE_CLOSURE
    owner: artifact_layer
    checks:
      - every_record_ref_resolves
      - every_reference_target_kind_is_allowed
      - no_partial_embedded_stored_record
      - persisted_reference_graph_is_topologically_constructible
      - aggregate_child_edges_have_no_versioned_back_reference
  - id: SCHEMA_CANONICALIZATION
    owner: artifact_layer
    checks:
      - key_order_invariance
      - declared_set_order_invariance
      - declared_sequence_order_sensitivity
      - decimal_and_timestamp_normalization
