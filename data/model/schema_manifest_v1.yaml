record_ref:
  fields:
    object_id: {type: string, required: true}
    object_version: {type: positive_integer, required: true}
  additional_fields: forbidden

record_meta:
  fields:
    object_id: {type: string, required: true}
    object_version: {type: positive_integer, required: true}
    schema_id: {type: string, required: true, version_suffix_forbidden: true}
    schema_version: {type: positive_integer, required: true}
    canonicalization_id: {type: string, const: UPS-CANONICAL-JSON}
    canonicalization_version: {type: positive_integer, const: 1}
    owner_id: {type: string, required: true}
    provenance_status:
      type: enum
      values: [documented, hypothetical, simulated, derived]
    source_basis:
      type: enum
      values: [versioned_sources, synthetic_no_external_source]
    source_refs: {type: list_record_ref, required: true}
  additional_fields: forbidden
  set_semantics_paths: [/source_refs]
  invariants:
    - versioned_sources_requires_nonempty_source_refs
    - synthetic_no_external_source_requires_empty_source_refs
    - documented_and_derived_require_versioned_sources
    - object_id_and_version_resolve_to_one_content_hash

stored_record:
  fields:
    meta: {type: record_meta, required: true}
    payload: {type: discriminated_payload, required: true}
    content_hash: {type: sha256_lower_hex, required: true}
  additional_fields: forbidden
  invariants:
    - payload_domain_id_equals_meta_object_id
    - payload_cannot_repeat_envelope_authority_fields
    - payload_validates_before_hashing
    - content_hash_excluded_from_hash_input

auxiliary_schema_families:
  formal_model.boolean_predicate:
    schema_version: 1
    fields:
      value: boolean
  formal_model.assessment_value:
    schema_version: 1
    discriminators: [boolean, decimal, id_set, interval]
  formal_model.typed_value:
    schema_version: 1
    discriminator_field: kind
    variants:
      null: {fields: {}}
      boolean: {fields: {value: boolean}}
      integer: {fields: {value: integer}}
      decimal: {fields: {value: normalized_decimal_string, unit_id: nullable_string}}
      string: {fields: {value: string}}
      id: {fields: {value: string}}
      record_ref: {fields: {value: record_ref}}
      list: {fields: {semantics: {enum: [ordered, set]}, values: typed_value_list}}
      mapping: {fields: {entries: mapping_string_to_typed_value}}
  formal_model.rule_input_spec:
    schema_version: 1
    fields:
      role_id: string
      accepted_schema_refs: list_schema_ref
      cardinality: {enum: [one, optional, many]}
    set_semantics_paths: [/accepted_schema_refs]
  formal_model.input_field_binding:
    schema_version: 1
    fields:
      input_role_id: string
      field_path: json_pointer
  formal_model.evaluation_input_binding:
    schema_version: 1
    fields:
      role_id: string
      record_ref: record_ref
  formal_model.assessment_component_binding:
    schema_version: 1
    fields:
      role_id: string
      relation: {enum: [conjunctive_required, alternative_sufficient, contextual]}
      assessment_ref: record_ref
  formal_model.event_rule_execution:
    schema_version: 1
    fields:
      execution_role: {enum: [transformation, decision, transition, applicability, materiality, support, intervention, aggregation]}
      rule_ref: record_ref
      input_bindings: list_evaluation_input_binding
    set_semantics_paths: [/input_bindings]
  formal_model.expected_assessment_spec:
    schema_version: 1
    fields:
      property_or_helper_id: closed_property_or_helper_id
      expected_status: {enum: [pass, fail, unassessable, not_applicable]}
      expected_completeness: {enum: [complete, incomplete, invalid]}
      expected_value: nullable_assessment_value
      required_diagnostic_codes: list_closed_diagnostic_code
      scope_declaration_ref: nullable_record_ref
      applicability_rule_ref: nullable_record_ref
      false_antecedent_required: boolean
    set_semantics_paths: [/required_diagnostic_codes]

