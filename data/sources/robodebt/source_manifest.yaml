        summary: Automated government decisions should have a clear review path, plain-language disclosure, and inspectable business rules and algorithms.
      - anchor_id: RRC-17-2
        locator: Recommendation 17.2
        summary: Consider a body empowered to monitor and audit automated decision-making processes.
      - anchor_id: RRC-18-1
