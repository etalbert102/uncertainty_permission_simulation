claims:
  - claim_id: RB-CLAIM-001
    text: OCI launched in July 2016, with a limited rollout followed by wider rollout in September 2016.
    source_refs: [OMB-OCI-2017#OMB17-1.17-1.29]
    provenance: documented
    axes: [historical_process]
  - claim_id: RB-CLAIM-002
    text: The early OCI initial notice used a 21-day response period and a reminder was issued after 14 days.
    source_refs: [OMB-OCI-2017#OMB17-1.17-1.29, RRC-MAP-4B-2023#MAP-4B-1-5]
    provenance: documented
    axes: [historical_process]
  - claim_id: RB-CLAIM-003
    text: If the customer did not respond by the due date, OCI evenly apportioned ATO earnings over the employer-reported period, calculated any debt, issued a debt notice, and normal recovery commenced.
    source_refs: [OMB-OCI-2017#OMB17-1.17-1.29, RRC-MAP-4B-2023#MAP-4B-29-36]
    provenance: documented
    axes: [historical_process, evidentiary_support]
  - claim_id: RB-CLAIM-004
    text: A responding customer could correct or add employer, amount, and pay-period information; system errors could route to a compliance officer for manual assessment.
    source_refs: [OMB-OCI-2017#OMB17-1.17-1.29, RRC-MAP-4B-2023#MAP-4B-7-17]
    provenance: documented
    axes: [historical_process]
  - claim_id: RB-CLAIM-005
    text: New information could trigger reassessment, and internal review remained available.
    source_refs: [OMB-OCI-2017#OMB17-1.17-1.29]
    provenance: documented
    axes: [historical_process, restoration]
  - claim_id: RB-CLAIM-006
    text: By the April 2017 report, changes included direct-code access, clearer contact routes, registered-mail and phone follow-up, a 28-day response period measured from receipt, signposted extensions, and more manual intervention.
    source_refs: [OMB-OCI-2017#OMB17-1.30-1.46]
    provenance: documented
    axes: [historical_process]
  - claim_id: RB-CLAIM-007
    text: The enhanced bundle included manual intervention for disputes, complex circumstances, and lack of access to payslips or bank statements, plus a bank-statement option.
    source_refs: [OMB-OCI-2017#OMB17-1.30-1.46]
    provenance: documented
    axes: [historical_process, evidence_access]
  - claim_id: RB-CLAIM-008
    text: The enhanced bundle withheld debt-collector referral after nonresponse until the agency was satisfied the person had received the notice and was ignoring it.
    source_refs: [OMB-OCI-2017#OMB17-1.30-1.46]
    provenance: attributed_agency_statement
    axes: [historical_process, recovery]
  - claim_id: RB-CLAIM-009
    text: The Royal Commission recommended clear review paths, inspectable automated-decision rules, and stronger monitoring and audit.
    source_refs: [RRC-REPORT-2023#RRC-17-1, RRC-REPORT-2023#RRC-17-2]
    provenance: documented
    axes: [governance]
  - claim_id: RB-CLAIM-010
    text: The historical sources do not provide empirical queue-capacity, service-time, engagement-probability, or evidence-retrieval distributions suitable for numeric reconstruction.
    source_refs: [OMB-OCI-2017, OMB-IMPLEMENTATION-2019, RRC-MAP-4B-2023]
    provenance: inferred
    axes: [claim_limit]

prohibited_claims:
  - Historical queue and service parameters are measured by this packet.
  - The simulation independently determines whether a historical debt was lawful.
  - R-OCI-Enhanced is the same process as later EIC or CUPI.
  - Income apportionment findings are interchangeable with Robodebt income averaging findings.
  - Robodebt establishes strategic inducibility, observability, repeatability, benefit, or adversarial exploitation.
  - Services Australia's current AI strategy shows that a current AI system reproduces Robodebt.
