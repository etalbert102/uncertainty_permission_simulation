manifest_id: robodebt-source-manifest
manifest_version: 1
status: slice-0-candidate
retrieved_through: 2026-10-31
owner: study-source-audit

provenance_levels:
  documented:
    meaning: Directly stated in an authoritative source or displayed in a cited process-map node.
  attributed_agency_statement:
    meaning: Reported by an oversight source as an agency statement; not independently verified by this study.
  inferred:
    meaning: A bounded relationship inferred from multiple documented anchors; must be identified as inference.
  stylized:
    meaning: Study-authored structure or value used for simulation; has no historical-frequency interpretation.
  unsupported:
    meaning: Not established by the fixed source packet and prohibited as a historical claim.

